apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter
  labels:
    app: temperature-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
      - name: temperature-converter
        image: veiston/temperature-converter:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DISPLAY
          value: "host.minikube.internal:0.0"
