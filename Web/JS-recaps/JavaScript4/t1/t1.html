<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="t1.css" />
    <script src="t1.js" defer></script>
  </head>

  <body>
    <h1>Todo List</h1>
    <button id="add-item-btn" type="button">Add Item</button>
    <ul></ul>
    <dialog id="add-item-dialog">
      <form id="add-item-form" method="dialog">
        <input id="new-item-input" name="task" type="text" required />
        <button id="save-item-btn" type="submit">Save</button>
        <button id="cancel-item-btn" type="button">Cancel</button>
      </form>
    </dialog>
  </body>
</html>
